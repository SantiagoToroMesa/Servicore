<div class="">
@if(!item.children) {
  <a [routerLink]="item.route">
    {{item.label}}
  </a>
}
@if(item.children) {
  <div (click)="toggle()">
    {{item.label}}
  </div>
}
<div class="grid grid-cols-1">
  @if(isOpen()){
  @for (child of item.children; track child.label) {
    <app-sidebar-item [item]="child"></app-sidebar-item>
  }
}
</div>
</div>
